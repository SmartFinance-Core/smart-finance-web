<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Smart Finance</h1>
      <p class="text-gray-500 mt-2">Crea tu cuenta gratuita</p>
    </div>

    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
      {{ successMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input type="email" formControlName="email"
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500"
               placeholder="tu@email.com">
        <p *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('email')"
           class="text-red-500 text-xs mt-1">Ingresa un correo válido.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input type="password" formControlName="password"
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500"
               placeholder="Mínimo 6 caracteres">
        <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('minlength')"
           class="text-red-500 text-xs mt-1">La contraseña debe tener al menos 6 caracteres.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Confirmar Contraseña</label>
        <input type="password" formControlName="confirmPassword"
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500"
               placeholder="Repite tu contraseña">
        <p *ngIf="registerForm.touched && registerForm.hasError('passwordsMismatch')"
           class="text-red-500 text-xs mt-1">Las contraseñas no coinciden.</p>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading"
              class="w-full flex justify-center py-3 px-4 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 transition-colors">
        {{ isLoading ? 'Creando cuenta...' : 'Crear Cuenta' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-blue-600 hover:underline font-medium">Inicia sesión</a>
    </p>
  </div>
</div>
